services:
  api:
    build: .
    image: fundinfo-pipeline
    restart: unless-stopped

    # Host networking reaches an Ollama bound to 127.0.0.1 on this machine.
    # The API listens on API_PORT of the host directly.

    network_mode: host
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      API_PORT: ${API_PORT:-8000}
      SIESTA_API: ${SIESTA_API:-http://anaconda.csd.auth.gr:8080}
      SIESTA_LOG_NAME: ${SIESTA_LOG_NAME:-fundinfo_pipeline}
      LLM_URL: ${LLM_URL:-http://localhost:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-gemma4:e4b}

    # Caches, the base run and every API run live here, shared with command-line runs.

    volumes:
      - ./output:/app/output
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen(f'http://localhost:{os.environ[\"API_PORT\"]}/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
